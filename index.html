<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TMW ∙ DEPT — Surf Daybreak 8D Interface</title>
    <meta name="description" content="Spatial streaming database. Ocean teal, dawn coral, seafoam." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />

    <script>
        // Global Theme Init
        const savedTheme = localStorage.getItem('TMW-dept-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* ════════════════════════════════════════════
       SURF DAYBREAK 8D / FLAT-SPATIAL SYSTEM
       ════════════════════════════════════════════ */
        :root {
            /* Surf Daybreak Palette */
            --clr-primary: #0C3340;
            /* Ocean Teal */
            --clr-secondary: #5A8894;
            /* Muted Teal */
            --clr-tertiary: #FF7A5C;
            /* Dawn Coral - Single Accent */
            --clr-neutral: #DFF1EC;
            /* Seafoam Foundation */
            --clr-surface: #F3FAF7;
            /* Lighter Surface */
            --clr-on-primary: #FFFFFF;

            /* Spatial / UI Mapping */
            --clr-bg: var(--clr-neutral);
            /* Using flat colors with opacity for glassmorphism depth, avoiding gradients */
            --clr-surface-glass: rgba(243, 250, 247, 0.65);
            --clr-surface-2: rgba(223, 241, 236, 0.8);
            --clr-surface-3: rgba(90, 136, 148, 0.1);
            --clr-border: rgba(12, 51, 64, 0.1);
            --clr-border-glow: rgba(255, 122, 92, 0.4);

            --clr-accent: var(--clr-tertiary);
            --clr-accent-dim: rgba(255, 122, 92, 0.15);

            --clr-text: var(--clr-primary);
            --clr-text-2: var(--clr-secondary);
            --clr-text-3: rgba(12, 51, 64, 0.4);
            --clr-modal-blur: rgba(223, 241, 236, 0.85);

            /* Typography - Forced to Montserrat */
            --ff-main: 'Montserrat', sans-serif;
            --ff-display: 'Montserrat', sans-serif;
            --ff-mono: 'Montserrat', sans-serif;

            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 28px;
            --radius-xl: 40px;

            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 32px;

            --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);

            /* Global Cursor Tracking */
            --mouse-x: 50vw;
            --mouse-y: 50vh;
        }

        [data-theme="dark"] {
            /* Surf Midnight Palette */
            --clr-primary: #F3FAF7;
            --clr-secondary: #92B4BE;
            --clr-tertiary: #FF7A5C;
            --clr-neutral: #051319;
            --clr-surface: #0A222D;
            --clr-on-primary: #02080B;

            --clr-surface-glass: rgba(10, 34, 45, 0.65);
            --clr-surface-2: rgba(10, 34, 45, 0.8);
            --clr-surface-3: rgba(146, 180, 190, 0.1);
            --clr-border: rgba(243, 250, 247, 0.1);
            --clr-text-3: rgba(243, 250, 247, 0.4);
            --clr-modal-blur: rgba(5, 19, 25, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--ff-main);
            background-color: var(--clr-bg);
            color: var(--clr-text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 80px;
            position: relative;
        }

        a {
            color: var(--clr-accent);
            text-decoration: none;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            outline: none;
        }

        img {
            display: block;
            max-width: 100%;
            user-select: none;
        }

        /* ── 8D SPATIAL BACKGROUND (FLAT BASE + BLUR) ── */
        .spatial-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
            background-color: var(--clr-neutral);
        }

        /* Flat geometric shapes blurred to create spatial depth without linear gradients */
        .spatial-orb-1,
        .spatial-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            transition: transform 0.2s ease-out;
        }

        .spatial-orb-1 {
            width: 40vw;
            height: 40vw;
            background: var(--clr-tertiary);
            top: calc(var(--mouse-y) - 20vw);
            left: calc(var(--mouse-x) - 20vw);
            opacity: 0.15;
        }

        .spatial-orb-2 {
            width: 50vw;
            height: 50vw;
            background: var(--clr-secondary);
            bottom: -10vh;
            right: -10vw;
            opacity: 0.2;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(var(--clr-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--clr-border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 80%);
        }

        @keyframes gridMove {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px);
            }
        }

        /* ── QUANTUM SPLASH SCREENS (8D Integration) ── */
        .cinematic-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s, transform 1.5s ease;
            perspective: 1500px;
            overflow: hidden;
            background: transparent;
        }

        .cinematic-splash::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--clr-surface-glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: -1;
        }

        .cinematic-splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05) translateZ(100px);
            filter: blur(10px);
        }

        .splash-aura {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, var(--clr-tertiary) 0%, transparent 60%);
            opacity: 0.15;
            filter: blur(60px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseAura 4s ease-in-out infinite alternate;
            z-index: 0;
        }

        .terminate-aura {
            background: radial-gradient(circle, var(--clr-secondary) 0%, transparent 60%);
            opacity: 0.2;
        }

        @keyframes pulseAura {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0.1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.25;
            }
        }

        .splash-logo-text {
            font-family: var(--ff-display);
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            color: var(--clr-primary);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            animation: quantumTitle 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-shadow: 0 20px 40px rgba(12, 51, 64, 0.2);
            z-index: 1;
            transform-style: preserve-3d;
        }

        .splash-logo-text span {
            color: var(--clr-accent);
            display: inline-block;
            animation: floatDot 3s ease-in-out infinite;
        }

        .terminate-text {
            color: var(--clr-primary);
            font-size: clamp(2.5rem, 8vw, 5rem);
        }

        .splash-tagline {
            font-family: var(--ff-main);
            font-size: clamp(0.75rem, 2.5vw, 0.9rem);
            color: var(--clr-secondary);
            font-weight: 700;
            letter-spacing: 0.2em;
            margin-top: 1rem;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            animation: fadeUpTag 1.5s ease forwards 1s;
            z-index: 1;
        }

        .splash-loading-bar {
            width: 180px;
            height: 3px;
            background: var(--clr-border);
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
            opacity: 0;
            animation: fadeUpTag 1.5s ease forwards 1.2s;
            z-index: 1;
        }

        .splash-progress {
            width: 0%;
            height: 100%;
            background: var(--clr-tertiary);
            animation: loadProgress 1.8s cubic-bezier(0.7, 0, 0.3, 1) forwards 1.4s;
        }

        @keyframes quantumTitle {
            0% {
                letter-spacing: -0.1em;
                opacity: 0;
                filter: blur(20px);
                transform: translateZ(-500px) rotateX(-20deg) scale(0.7);
            }

            40% {
                filter: blur(5px);
            }

            100% {
                letter-spacing: -0.02em;
                opacity: 1;
                filter: blur(0);
                transform: translateZ(0) rotateX(0deg) scale(1);
            }
        }

        @keyframes fadeUpTag {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes floatDot {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px) scale(1.1);
                color: var(--clr-tertiary);
                text-shadow: 0 10px 20px var(--clr-accent-dim);
            }
        }

        @keyframes loadProgress {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        /* ── NEURO-LINK AUTHENTICATION ── */
        .auth-screen {
            position: fixed;
            inset: 0;
            background-color: rgba(223, 241, 236, 0.8);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: var(--spacing-md);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .auth-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05);
        }

        .form {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 40px var(--spacing-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            border-radius: var(--radius-xl);
            background: var(--clr-surface-glass);
            border: 1px solid var(--clr-on-primary);
            box-shadow: 0 20px 50px rgba(12, 51, 64, 0.1);
            text-align: center;
            overflow: hidden;
        }

        .form-title {
            font-weight: 600;
            font-size: clamp(1.8rem, 8vw, 2.3rem);
            letter-spacing: -0.02em;
            z-index: 1;
            font-family: var(--ff-display);
            color: var(--clr-primary);
        }

        .form-title span {
            font-family: var(--ff-main);
            color: var(--clr-secondary);
            font-weight: 500;
            font-size: 1rem;
            display: block;
            margin-top: 8px;
            letter-spacing: 0;
            text-transform: none;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            z-index: 1;
        }

        .input {
            width: 100%;
            height: 56px;
            border-radius: var(--radius-md);
            border: 2px solid var(--clr-border);
            background: var(--clr-on-primary);
            font-family: var(--ff-main);
            font-size: 1.1rem;
            color: var(--clr-primary);
            padding: 5px 60px 5px 20px;
            outline: none;
            font-weight: 800;
            transition: all var(--transition);
            letter-spacing: 2px;
            text-align: center;
        }

        .input::placeholder {
            color: var(--clr-text-3);
            font-weight: 600;
            letter-spacing: 1px;
            font-family: var(--ff-main);
            text-transform: none;
        }

        .input:focus {
            border-color: var(--clr-accent);
            box-shadow: 0 0 0 4px var(--clr-accent-dim);
            background: var(--clr-on-primary);
        }

        .password-toggle {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--clr-secondary);
            transition: color 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: var(--clr-accent);
        }

        .auth-feedback {
            font-family: var(--ff-main);
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 20px;
            z-index: 1;
        }

        .button-confirm {
            width: 100%;
            height: 56px;
            border-radius: var(--radius-md);
            background: var(--clr-accent);
            font-size: 1rem;
            font-weight: 600;
            color: var(--clr-on-primary);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--clr-accent-dim);
            letter-spacing: 0.05em;
        }

        .button-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 122, 92, 0.3);
        }

        .button-confirm:active {
            transform: translateY(1px) scale(0.98);
        }

        /* ── FLOATING SPATIAL NAVBAR ── */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 90%;
            max-width: 1400px;
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--clr-surface-glass);
            border: 1px solid var(--clr-on-primary);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 10px 30px rgba(12, 51, 64, 0.05);
            transition: all var(--transition);
        }

        .navbar.scrolled {
            width: 100%;
            top: 0;
            border-radius: 0;
            background: rgba(243, 250, 247, 0.9);
        }

        .nav-logo {
            font-family: var(--ff-display);
            font-weight: 900;
            font-size: 1.4rem;
            color: var(--clr-primary);
            letter-spacing: -0.02em;
        }

        .nav-logo span {
            color: var(--clr-accent);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: var(--clr-on-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--clr-primary);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--clr-border);
        }

        .icon-btn:hover {
            transform: scale(1.05) translateY(-2px);
            border-color: var(--clr-secondary);
            box-shadow: 0 5px 15px rgba(12, 51, 64, 0.1);
            color: var(--clr-accent);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .nav-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--ff-main);
            font-size: 0.72rem;
            background: var(--clr-surface);
            color: var(--clr-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--clr-border);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: var(--clr-secondary);
            border-radius: 50%;
        }

        /* ── HERO & COMMAND CONSOLE ── */
        .hero {
            max-width: 1400px;
            margin: 120px auto 20px;
            padding: 40px var(--spacing-md);
            text-align: center;
        }

        .holographic-title {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 40px;
            line-height: 1.1;
            color: var(--clr-primary);
            position: relative;
            display: inline-block;
            font-family: var(--ff-display);
        }

        /* Spatial Search Console */
        .search-container {
            max-width: 800px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--clr-on-primary);
            border-radius: var(--radius-lg);
            padding: 8px 8px 8px 24px;
            gap: 16px;
            border: 1px solid var(--clr-border);
            box-shadow: 0 15px 35px rgba(12, 51, 64, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-box:focus-within {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(12, 51, 64, 0.1);
            border-color: var(--clr-secondary);
        }

        .search-icon {
            color: var(--clr-secondary);
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: none;
            border: none;
            font-family: var(--ff-main);
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--clr-primary);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--clr-text-3);
            font-weight: 400;
        }

        .search-btn {
            background: var(--clr-tertiary);
            color: var(--clr-on-primary);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 14px 28px;
            border-radius: var(--radius-md);
            transition: all 0.3s;
        }

        .search-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px var(--clr-accent-dim);
        }

        /* Type Switcher (Movies/TV) */
        .type-switch {
            display: inline-flex;
            background: var(--clr-on-primary);
            padding: 6px;
            border-radius: var(--radius-md);
            border: 1px solid var(--clr-border);
            margin-bottom: 40px;
            position: relative;
        }

        .type-btn {
            padding: 10px 28px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            color: var(--clr-secondary);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 2;
        }

        .type-btn.active {
            color: var(--clr-on-primary);
        }

        .type-pill-bg {
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 6px;
            width: calc(50% - 6px);
            background: var(--clr-primary);
            border-radius: var(--radius-sm);
            z-index: 1;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* TMDB Genres */
        .quick-genres {
            display: flex;
            justify-content: flex-start;
            flex-wrap: nowrap;
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .quick-genres::-webkit-scrollbar {
            display: none;
        }

        .genre-pill {
            flex-shrink: 0;
            background: var(--clr-on-primary);
            color: var(--clr-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--clr-border);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .genre-pill:hover {
            background: var(--clr-surface);
            transform: translateY(-2px);
            border-color: var(--clr-secondary);
            color: var(--clr-primary);
        }

        .genre-pill.active {
            background: var(--clr-primary);
            color: var(--clr-on-primary);
            border-color: transparent;
        }

        /* ── 8D PARALLAX GRID ── */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px var(--spacing-md) 60px;
        }

        .section-header {
            margin-bottom: 30px;
            text-align: left;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            position: relative;
            display: inline-block;
            color: var(--clr-primary);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 30px;
            height: 3px;
            background: var(--clr-accent);
            border-radius: 2px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            perspective: 1200px;
        }

        @media (min-width: 600px) {
            .movies-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 30px;
            }
        }

        @media (min-width: 900px) {
            .movies-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 40px;
            }
        }

        @media (min-width: 1200px) {
            .movies-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 40px;
            }
        }

        /* Ultimate 3D Card (Flat spatial style) */
        .movie-card {
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            will-change: transform;
            border-radius: var(--radius-lg);
        }

        .card-poster-wrap {
            width: 100%;
            aspect-ratio: 2/3;
            position: relative;
            border-radius: var(--radius-lg);
            transform-style: preserve-3d;
            transform: translateZ(20px);
            box-shadow: 0 15px 35px rgba(12, 51, 64, 0.15);
            transition: box-shadow 0.3s, border-color 0.3s;
            background: var(--clr-on-primary);
            overflow: hidden;
            border: 1px solid var(--clr-border);
        }

        .movie-card:hover .card-poster-wrap {
            box-shadow: 0 25px 50px rgba(12, 51, 64, 0.25);
            border-color: var(--clr-secondary);
        }

        .card-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        .card-glare {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.6) 25%, transparent 30%);
            transform: translateZ(40px);
            mix-blend-mode: overlay;
        }

        .movie-card:hover .card-glare {
            opacity: 1;
        }

        .media-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--clr-on-primary);
            color: var(--clr-primary);
            font-family: var(--ff-main);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--clr-border);
            transform: translateZ(50px);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(12, 51, 64, 0.1);
        }

        .card-info {
            padding: 16px 4px 0;
            transform: translateZ(30px);
            transform-style: preserve-3d;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            color: var(--clr-primary);
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--clr-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-rating-inline {
            color: var(--clr-accent);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .load-more-btn {
            background: var(--clr-on-primary);
            color: var(--clr-primary);
            font-size: 1rem;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: var(--radius-md);
            width: auto;
            min-width: 250px;
            margin: 60px auto 0;
            display: block;
            border: 1px solid var(--clr-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .load-more-btn:hover {
            background: var(--clr-secondary);
            color: var(--clr-on-primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(12, 51, 64, 0.1);
        }

        /* ── FLAT-SPATIAL MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 5500;
            background: var(--clr-modal-blur);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
            perspective: 2000px;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--clr-surface);
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            max-height: 850px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--clr-on-primary);
            box-shadow: 0 30px 60px rgba(12, 51, 64, 0.15);
            display: flex;
            flex-direction: column;
            transform: translateZ(-100px) scale(0.95);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-card {
            transform: translateZ(0) scale(1);
            opacity: 1;
        }

        .editor-header {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            background: var(--clr-on-primary);
            border-bottom: 1px solid var(--clr-border);
        }

        .editor-dots {
            display: flex;
            gap: 8px;
        }

        .editor-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--clr-secondary);
            opacity: 0.5;
        }

        .editor-title {
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--clr-secondary);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .editor-close-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: var(--clr-surface);
            color: var(--clr-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 1px solid var(--clr-border);
        }

        .editor-close-btn:hover {
            background: var(--clr-tertiary);
            color: var(--clr-on-primary);
            border-color: transparent;
            transform: rotate(90deg);
        }

        .editor-body {
            display: flex;
            flex-direction: row;
            flex: 1;
            overflow: hidden;
        }

        /* Decryption Terminal Left */
        .editor-code {
            background: var(--clr-primary);
            color: var(--clr-on-primary);
            padding: 30px;
            font-size: 0.9rem;
            line-height: 1.8;
            border-right: 1px solid var(--clr-border);
            width: 35%;
            overflow-y: auto;
            position: relative;
        }

        /* Cinematic Visuals Right */
        .editor-visuals {
            padding: 40px;
            flex: 1;
            overflow-y: auto;
            position: relative;
            background: var(--clr-surface);
        }

        @media (max-width: 900px) {
            .editor-body {
                flex-direction: column;
            }

            .editor-code {
                width: 100%;
                height: 180px;
                border-right: none;
                border-bottom: 1px solid var(--clr-border);
                padding: 20px;
            }

            .editor-visuals {
                padding: 24px;
            }

            .modal-card {
                height: 95vh;
                max-height: 95vh;
            }

        /* Terminal Formatting (Adapted to Surf Daybreak) */
        .syn-comment {
            color: var(--clr-secondary);
            font-style: italic;
        }

        .syn-keyword {
            color: var(--clr-tertiary);
            font-weight: 600;
        }

        .syn-key {
            color: var(--clr-neutral);
        }

        .syn-string {
            color: var(--clr-on-primary);
        }

        .syn-number {
            color: var(--clr-tertiary);
        }

        .syn-punct {
            color: var(--clr-secondary);
        }

        /* FIX: Bug where long titles in code line wrap and hide due to white-space: nowrap in original code */
        .code-line {
            display: block;
            opacity: 0;
            animation: fadeInCode 0.5s ease forwards;
            word-break: break-all;
            margin-bottom: 4px;
        }

        @keyframes fadeInCode {
            0% {
                opacity: 0;
                transform: translateX(-10px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }

        /* Detail Layout */

        .modal-poster-small {

            font-weight: 600;

        }

            color: var(--clr-on-primary);

            font-weight: 600;
            padding: 14px;
            border-radius: var(--radius-md);

        .trailer-btn:hover {

        .trailer-btn.secondary {
            background: var(--clr-on-primary);

            box-shadow: none;
            border: 1px solid var(--clr-border);
        }

        .trailer-btn.secondary:hover {
            background: var(--clr-surface);
            box-shadow: 0 5px 15px rgba(12, 51, 64, 0.05);
        }

        /* TV Episode Selector */
        .tv-selector-panel {
            background: var(--clr-on-primary);
            border: 1px solid var(--clr-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 30px;
        }

        .tv-season-select {
            width: 100%;
            padding: 14px;
            background: var(--clr-surface);
            color: var(--clr-primary);
            border: 1px solid var(--clr-border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 10px;

        .episode-grid::-webkit-scrollbar {
            width: 6px;

        .episode-grid::-webkit-scrollbar-thumb {
            background: var(--clr-border);
            border-radius: 10px;
        }

        .ep-btn {
            background: var(--clr-surface);
            border: 1px solid var(--clr-border);
            color: var(--clr-primary);
            padding: 10px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }

        .ep-btn span.ep-num {
            color: var(--clr-secondary);
            font-weight: 700;
            font-size: 1rem;
        }

        .ep-btn:hover {
            background: var(--clr-neutral);
            transform: scale(1.03);
            border-color: var(--clr-secondary);
        }

        .ep-btn.active {
            background: var(--clr-tertiary);
            color: var(--clr-on-primary);
            border-color: transparent;
        }

        .ep-btn.active span.ep-num {
            color: var(--clr-on-primary);
        }

        /* Torrent List Array */
        .data-list-group {
            width: 100%;
            background: var(--clr-on-primary);
            border-radius: var(--radius-lg);
            margin-top: 30px;
            border: 1px solid var(--clr-border);
            overflow: hidden;
        }

        .data-list-header {
            padding: 16px 24px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--clr-secondary);
            border-bottom: 1px solid var(--clr-border);
            background: var(--clr-surface);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .data-list-item {
            padding: 24px;
            border-bottom: 1px solid var(--clr-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background 0.3s;
        }

        .data-list-item:hover {
            background: var(--clr-surface);
        }

        .data-list-item:last-child {
            border-bottom: none;
        }

        .torrent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .t-quality {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--clr-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-4k {
            background: var(--clr-tertiary);
            color: var(--clr-on-primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .t-size {
            font-size: 0.9rem;
            color: var(--clr-secondary);
            font-weight: 500;
        }

        .t-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .t-stat {
            color: var(--clr-text-3);
            margin-right: 6px;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
        }

        .val-green {
            color: var(--clr-secondary);
        }

        .val-orange {
            color: var(--clr-tertiary);
        }

        .t-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .t-btn {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .t-btn-primary {
            background: var(--clr-surface);
            color: var(--clr-primary);
            border: 1px solid var(--clr-border);
        }

        .t-btn-primary:hover {
            background: var(--clr-secondary);
            color: var(--clr-on-primary);
            border-color: transparent;
            transform: translateY(-2px);
        }

        .t-btn-secondary {
            background: transparent;
            color: var(--clr-secondary);
            border: 1px solid var(--clr-border);
        }

        .t-btn-secondary:hover {
            background: var(--clr-surface);
            transform: translateY(-2px);
        }

        /* ── THEATER PLAYER MODAL (8D Spatial) ── */
        .video-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 6000;
            background: rgba(12, 51, 64, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            perspective: 1500px;
        }

        .video-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .video-modal-container {
            background: var(--clr-primary);
            width: 100%;
            max-width: 1400px;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(12, 51, 64, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: translateZ(50px) scale(0.95);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            height: 90vh;
            /* Fixed height for consistent control bar placement */
        }

        .video-modal-overlay.active .video-modal-container {
            transform: translateZ(0) scale(1);
        }

        .video-modal-container:fullscreen {
            max-width: none;
            height: 100vh;
            width: 100vw;
            border-radius: 0;
            border: none;
        }

        .video-wrapper {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            /* Grow/shrink dynamically, prevent overflow */
            background: #000;
            position: relative;
        }

        .video-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Theater Master Control Bar */
        .master-control-bar {
            background: var(--clr-primary);
            border-top: 1px solid rgba(255, 255, 255, 0.1);

            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

        .mcb-title {
            font-family: var(--ff-display);

            font-weight: 600;

            white-space: nowrap;

            text-overflow: ellipsis;

        .mcb-status {

            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--clr-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;

        .mcb-center {

            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);

            overflow-x: auto;

        .mcb-center::-webkit-scrollbar {
            display: none;

        .mcb-server-btn {
            color: var(--clr-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: all 0.3s;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .mcb-server-btn:hover {
            color: var(--clr-on-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .mcb-server-btn.active {
            background: var(--clr-tertiary);
            color: var(--clr-on-primary);
        }

        .mcb-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mcb-action-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            color: var(--clr-on-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mcb-action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .editor-body {
                flex-direction: column;
            }

            .editor-code {
                width: 100%;
                height: 180px;
                border-right: none;
                border-bottom: 1px solid var(--clr-border);
                padding: 20px;
            }

            .editor-visuals {
                padding: 24px;
            }

            .modal-card {
                height: 95vh;
                max-height: 95vh;
            }
        }

        @media (max-width: 768px) {
            .hidden-mobile {
                display: none !important;
            }

            .hero {
                margin-top: 100px;
                padding: 20px 16px;

    <!-- SPATIAL 8D BACKGROUND (Surf Daybreak style) -->
    <div class="spatial-bg">
        <div class="spatial-orb-1"></div>
        <div class="spatial-orb-2"></div>
    </div>
    <div class="grid-overlay"></div>

    <!-- QUANTUM SPLASH -->
    <div id="splash-screen" class="cinematic-splash">

        <div class="splash-loading-bar">
            <div class="splash-progress"></div>
        </div>

    <script>
        'use strict';

        /* ── SPATIAL CURSOR TRACKING (8D EFFECT) ── */
        document.addEventListener('mousemove', e => {
            document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        /* ── HELPER FUNCTIONS ── */
        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
        const langNames = new Intl.DisplayNames(['en'], { type: 'language' });
        function getLang(code) { try { return langNames.of(code); } catch { return code; } }
        function formatRuntime(mins) { if (!mins) return 'N/A'; return `${Math.floor(mins / 60)}h ${mins % 60}m`; }

        /* ── BOOT & AUTHENTICATION ── */
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) { splash.classList.add('hidden'); setTimeout(() => splash.remove(), 1500); }
            }, 3400); // Matches new progress bar animation time
        });

        const togglePasswordBtn = document.getElementById('toggle-password');
        const authInput = document.getElementById('auth-password');
        const eyeIcon = document.getElementById('eye-icon');
        togglePasswordBtn.addEventListener('click', () => {
            if (authInput.type === 'password') {
                authInput.type = 'text'; eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            } else {
                authInput.type = 'password'; eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            }
        });

        const VALID_HASH = "VG13LmRlcHQ4Nw==";
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (btoa(authInput.value) === VALID_HASH) {
                document.getElementById('auth-feedback').textContent = "Access Granted.";
                document.getElementById('auth-feedback').style.color = "var(--clr-secondary)";
                setTimeout(() => document.getElementById('auth-screen').classList.add('hidden'), 800);
            } else {
                document.getElementById('auth-feedback').textContent = "Access Denied.";
                document.getElementById('auth-feedback').style.color = "var(--clr-tertiary)";
            }
        });

        /* ── UI CONTROLS ── */
        const themeBtn = document.getElementById('theme-toggle');
        function updateThemeIcon() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.getElementById('icon-sun').style.display = isDark ? 'block' : 'none';
            document.getElementById('icon-moon').style.display = isDark ? 'none' : 'block';
        }
        updateThemeIcon();
        themeBtn.addEventListener('click', () => {
            const target = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('TMW-dept-theme', target);
            updateThemeIcon();
        });

        document.getElementById('exit-button').addEventListener('click', () => {
            window.scrollTo(0, 0);
            document.getElementById('end-splash').classList.remove('hidden');
            setTimeout(() => {
                authInput.value = ''; authInput.type = 'password'; document.getElementById('auth-feedback').textContent = 'Awaiting Input...';
                document.getElementById('auth-feedback').style.color = "";
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('end-splash').classList.add('hidden');
            }, 2500);
        });

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });

        function goHome(e) {
            if (e) e.preventDefault();
            window.scrollTo(0, 0);
            STATE.query = '';
            STATE.genre = '';
            document.getElementById('search-input').value = '';
            document.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
            const trendingPill = document.querySelector('.genre-pill[data-id=""]');
            if (trendingPill) trendingPill.classList.add('active');
            resetAndLoad(`Trending ${STATE.type === 'movie' ? 'Cinema' : 'Series'}`);
        }

        document.getElementById('logo-link').addEventListener('click', goHome);
        document.getElementById('refresh-button').addEventListener('click', goHome);

        /* ── TMDB CORE ── */
        const TMDB_KEY = '232a7338c36748bff95e5de149a21b95';
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        const MAGNET_TRACKERS = ['udp://open.demonii.com:1337/announce', 'udp://tracker.openbittorrent.com:80', 'udp://tracker.coppersurfer.tk:6969'].join('&tr=');

        let STATE = { type: 'movie', query: '', genre: '', page: 1, loading: false };
        const elements = { grid: document.getElementById('movies-grid'), loadBtn: document.getElementById('load-more-btn') };

        // Switch Logic
        const typeBtns = document.querySelectorAll('.type-btn');
        const typeBg = document.getElementById('type-pill-bg');
        typeBtns.forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                typeBg.style.transform = `translateX(${idx * 100}%)`;
                STATE.type = btn.dataset.type;
                resetAndLoad(`Trending ${STATE.type === 'movie' ? 'Cinema' : 'Series'}`);
            });
        });

        document.querySelectorAll('.genre-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                STATE.genre = pill.dataset.id;
                const name = pill.textContent;
                resetAndLoad(STATE.genre ? `${name} ${STATE.type === 'movie' ? 'Cinema' : 'Series'}` : `Trending ${STATE.type === 'movie' ? 'Cinema' : 'Series'}`);
            });
        });

        document.getElementById('search-btn').addEventListener('click', performSearch);
        document.getElementById('search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });

        function performSearch() {
            STATE.query = document.getElementById('search-input').value;
            if (STATE.query) {
                document.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
                resetAndLoad(`Query: "${STATE.query}"`);
            }
        }

        function resetAndLoad(title) {
            if (!STATE.query) document.getElementById('search-input').value = '';
            document.getElementById('section-title-text').textContent = title;
            loadMedia(true);
        }

        elements.loadBtn.addEventListener('click', () => { STATE.page++; loadMedia(false); });

        /* ── FETCH & RENDER ── */
        async function loadMedia(reset = true) {
            if (STATE.loading) return;
            STATE.loading = true;
            if (reset) { STATE.page = 1; elements.grid.innerHTML = ''; }
            elements.loadBtn.hidden = true;

            const loadingEl = document.createElement('div');
            loadingEl.id = 'loading-indicator';
            loadingEl.style = 'grid-column: 1/-1; text-align:center; padding: 60px; color:var(--clr-secondary); font-weight:600; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.1em;';
            loadingEl.innerHTML = 'Decrypting Signals...';
            if (reset) elements.grid.appendChild(loadingEl);

            let url = '';
            if (STATE.query) {
                url = `${TMDB_BASE}/search/${STATE.type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(STATE.query)}&page=${STATE.page}`;
            } else if (STATE.genre === 'anime') {
                url = `${TMDB_BASE}/discover/${STATE.type}?api_key=${TMDB_KEY}&with_genres=16&with_original_language=ja&page=${STATE.page}&sort_by=popularity.desc`;
            } else if (STATE.genre) {
                url = `${TMDB_BASE}/discover/${STATE.type}?api_key=${TMDB_KEY}&with_genres=${STATE.genre}&page=${STATE.page}&sort_by=popularity.desc`;
            } else {
                url = `${TMDB_BASE}/trending/${STATE.type}/week?api_key=${TMDB_KEY}&page=${STATE.page}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                const loader = document.getElementById('loading-indicator');
                if (loader) loader.remove();

                if (data.results && data.results.length > 0) {
                    data.results.forEach(item => elements.grid.appendChild(createCard(item, STATE.type)));
                    elements.loadBtn.hidden = STATE.page >= data.total_pages;
                } else if (reset) {
                    elements.grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 60px; color:var(--clr-secondary);">No valid data found in array.</div>`;
                }
            } catch (err) {
                const loader = document.getElementById('loading-indicator');
                if (loader) loader.innerHTML = '<span style="color:var(--clr-tertiary)">Signal Lost. Network error.</span>';
            } finally {
                STATE.loading = false;
            }
        }

        /* ── 8D CARD RENDERER ── */
        function createCard(item, type) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            const title = item.title || item.name;
            const year = (item.release_date || item.first_air_date || '').split('-')[0];
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';
            const poster = item.poster_path ? `${IMG_BASE}${item.poster_path}` : 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

            card.innerHTML = `
        <div class="card-poster-wrap">
          <img class="card-poster" src="${poster}" alt="${escHtml(title)}" loading="lazy" />
          <div class="card-glare"></div>
          <div class="media-badge">${type === 'movie' ? 'CINEMA' : 'SERIES'}</div>
        </div>
        <div class="card-info">
          <h3 class="card-title">${escHtml(title)}</h3>
          <p class="card-meta">${year} <span class="card-rating-inline">★ ${rating}</span></p>
        </div>
      `;

            card.addEventListener('mousemove', function (e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -15;
                const rotateY = ((x - centerX) / centerX) * 15;

                const glare = this.querySelector('.card-glare');
                glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.4), transparent 50%)`;

                this.style.transition = 'none';
                this.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
            });

            card.addEventListener('mouseleave', function () {
                this.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
                this.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                this.querySelector('.card-glare').style.background = 'transparent';
            });

            card.addEventListener('click', () => openMediaModal(item.id, type));
            return card;
        }

        /* ── ROBUST DECRYPTION MODAL LOGIC ── */
        async function openMediaModal(id, type) {
            document.body.style.overflow = 'hidden';
            const overlay = document.getElementById('modal-overlay');
            const terminal = document.getElementById('modal-terminal');
            const visuals = document.getElementById('modal-visuals');

            overlay.classList.add('active');
            terminal.innerHTML = `<div class="code-line" style="animation-delay: 0s;"><span class="syn-comment"># Initializing Neural Uplink...</span></div>`;
            visuals.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100%; color: var(--clr-secondary); font-weight: 600;">Processing Request...</div>`;

            try {
                const res = await fetch(`${TMDB_BASE}/${type}/${id}?api_key=${TMDB_KEY}&append_to_response=external_ids,videos`);
                if (!res.ok) throw new Error("TMDB Response Error");
                const data = await res.json();

                // Bug fix: Ensure optional chaining handles missing external_ids gracefully
                const imdbId = data?.external_ids?.imdb_id || '';

                let ytsTorrents = [];
                if (type === 'movie' && imdbId) {
                    try {
                        terminal.innerHTML += `<div class="code-line" style="animation-delay: 0.2s;"><span class="syn-comment"># Validating Proxy...</span></div>`;

                        // Added simple timeout logic for YTS to prevent hanging bug
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 4000); // 4 sec timeout

                        const ytsRes = await fetch(`https://movies-api.accel.li/api/v2/movie_details.json?imdb_id=${imdbId}`, { signal: controller.signal });
                        clearTimeout(timeoutId);

                        if (ytsRes.ok) {
                            const ytsData = await ytsRes.json();
                            if (ytsData.status === 'ok' && ytsData.data.movie) {
                                ytsTorrents = ytsData.data.movie.torrents || [];
                            }
                        }
                    } catch (e) {
                        console.log("YTS Proxy Blocked or Timed Out. Falling back safely.");
                    }
                }

                renderModalUI(data, type, imdbId, ytsTorrents);

            } catch (err) {
                console.error(err);
                visuals.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--clr-tertiary); font-weight: 600;">Uplink Failed. Connection rejected by central node.</div>`;
            }
        }

        function renderModalUI(data, type, imdbId, torrents) {
            const title = data.title || data.name || 'Unknown Title';
            const year = (data.release_date || data.first_air_date || '').split('-')[0] || 'N/A';
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'NR';

            const spokenLangs = (data.spoken_languages || []).map(l => l.english_name).join(', ');
            const language = spokenLangs || getLang(data.original_language) || 'Unknown';
            const runtime = type === 'movie' ? formatRuntime(data.runtime) : `${data.number_of_seasons || 0} Seasons (${data.number_of_episodes || 0} Shows)`;

            const genres = (data.genres || []).map(g => g.name);
            const poster = data.poster_path ? `${IMG_BASE}${data.poster_path}` : '';

            const trailer = data.videos?.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube');
            const trailerLink = trailer ? `https://youtube.com/watch?v=${trailer.key}` : null;

            // Fixed: Removed typing overflow bug which hid long text lines
            document.getElementById('modal-terminal').innerHTML = `
        <div class="code-line" style="animation-delay: 0s"><span class="syn-comment"># Payload Decrypted Successfully.</span></div>
        <div class="code-line" style="animation-delay: 0.1s"><span class="syn-keyword">const</span> quantumData = {</div>
        <div class="code-line" style="animation-delay: 0.2s">  <span class="syn-key">id</span><span class="syn-punct">:</span> <span class="syn-string">"${data.id}"</span><span class="syn-punct">,</span></div>
        <div class="code-line" style="animation-delay: 0.3s">  <span class="syn-key">type</span><span class="syn-punct">:</span> <span class="syn-string">"${type.toUpperCase()}"</span><span class="syn-punct">,</span></div>
        <div class="code-line" style="animation-delay: 0.4s">  <span class="syn-key">title</span><span class="syn-punct">:</span> <span class="syn-string">"${escHtml(title)}"</span><span class="syn-punct">,</span></div>
        <div class="code-line" style="animation-delay: 0.5s">  <span class="syn-key">year</span><span class="syn-punct">:</span> <span class="syn-number">${year}</span><span class="syn-punct">,</span></div>
        <div class="code-line" style="animation-delay: 0.6s">  <span class="syn-key">rating</span><span class="syn-punct">:</span> <span class="syn-number">${rating}</span><span class="syn-punct">,</span></div>
        <div class="code-line" style="animation-delay: 0.7s">  <span class="syn-key">language</span><span class="syn-punct">:</span> <span class="syn-string">"${language}"</span><span class="syn-punct">,</span></div>
        <div class="code-line" style="animation-delay: 0.8s">  <span class="syn-key">runtime</span><span class="syn-punct">:</span> <span class="syn-string">"${runtime}"</span><span class="syn-punct">,</span></div>
        <div class="code-line" style="animation-delay: 0.9s">  <span class="syn-key">hash</span><span class="syn-punct">:</span> <span class="syn-string">"${imdbId || 'N/A'}"</span></div>
        <div class="code-line" style="animation-delay: 1.0s">}<span class="syn-punct">;</span></div>
        <div class="code-line" style="animation-delay: 1.1s"><span class="syn-comment"># Rendering Interface...</span></div>
      `;

            let visualHTML = `
        <div class="editor-visual-header">
          <img src="${poster}" class="modal-poster-small" onerror="this.style.display='none'"/>
          <div style="flex:1;">
            <h2 class="modal-title">${escHtml(title)}</h2>
            <div class="modal-meta-row">
              <span class="modal-meta-chip">${year}</span>
              <span class="modal-meta-chip" style="color:var(--clr-tertiary); border-color:var(--clr-tertiary)">★ ${rating}</span>
              <span class="modal-meta-chip">🌐 ${language}</span>
              <span class="modal-meta-chip">⏱ ${runtime}</span>
            </div>
            <div class="action-btn-row">
              <button onclick="initPlayer('${type}', '${imdbId}', '${data.id}', 1, 1)" class="trailer-btn">▶ STREAM ONLINE</button>
              ${trailerLink ? `<a href="${trailerLink}" target="_blank" class="trailer-btn secondary">WATCH TRAILER</a>` : ''}
            </div>
          </div>
        </div>
        <p class="modal-summary">${escHtml(data.overview || 'Data sequence missing from central core.')}</p>
      `;

            if (type === 'tv' && data.seasons && data.seasons.length > 0) {
                const validSeasons = data.seasons.filter(s => s.season_number > 0);
                visualHTML += `
          <div class="tv-selector-panel">
            <h3 style="margin-bottom:16px; font-size:1rem; font-weight: 600; color:var(--clr-primary);">Select Node (Episode)</h3>
            <select class="tv-season-select" id="tv-season-select" onchange="loadEpisodes(${data.id}, this.value, '${imdbId}')">
              ${validSeasons.map(s => `<option value="${s.season_number}">Season ${s.season_number} (${s.episode_count} Episodes)</option>`).join('')}
            </select>
            <div id="tv-episodes-container" class="episode-grid"></div>
          </div>
        `;
                // Load first season automatically if it exists
                if (validSeasons.length > 0) {
                    setTimeout(() => loadEpisodes(data.id, validSeasons[0].season_number, imdbId), 100);
                }
            }

            visualHTML += `<div class="data-list-group">`;
            if (type === 'movie' && torrents && torrents.length > 0) {
                visualHTML += `<div class="data-list-header">DIRECT NODE ACCESS (YTS)</div>`;
                torrents.forEach(t => {
                    const is4K = t.quality === '2160p';
                    const badge = is4K ? `<span class="badge-4k">ULTRA HD</span>` : '';

                    visualHTML += `
            <div class="data-list-item">
              <div class="torrent-header">
                <span class="t-quality">${escHtml(t.quality)} ${badge}</span>
                <span class="t-size">${t.size}</span>
              </div>
              <div class="t-stats">
                <span><span class="t-stat">Seeds</span><span class="val-green">${t.seeds}</span></span>
                <span><span class="t-stat">Peers</span><span class="val-orange">${t.peers}</span></span>
              </div>
              <div class="t-actions">
                <a href="magnet:?xt=urn:btih:${t.hash}&dn=${encodeURIComponent(title)}&tr=${encodeURIComponent(MAGNET_TRACKERS)}" class="t-btn t-btn-primary">MAGNET LINK</a>
                <a href="${t.url}" class="t-btn t-btn-secondary">RAW FILE</a>
              </div>
            </div>`;
                });
            } else {
                const searchTitle = encodeURIComponent(title);
                visualHTML += `
          <div class="data-list-header">EXTERNAL INDEXERS</div>
          <div class="data-list-item">
            <p style="font-size:0.9rem; color:var(--clr-secondary); margin-bottom:16px;">Direct nodes unavailable. Rerouting to external swarms:</p>
            <div class="t-actions">
              <a href="https://1337x.to/search/${searchTitle}/1/" target="_blank" class="t-btn t-btn-primary">SEARCH 1337X</a>
              <a href="https://thepiratebay.org/search.php?q=${searchTitle}" target="_blank" class="t-btn t-btn-secondary">SEARCH TPB</a>
            </div>
          </div>`;
            }
            visualHTML += `</div>`;

            document.getElementById('modal-visuals').innerHTML = visualHTML;
        }

        async function loadEpisodes(tmdbId, seasonNum, imdbId) {
            const container = document.getElementById('tv-episodes-container');
            container.innerHTML = `<div style="grid-column:1/-1; color:var(--clr-secondary); padding:20px; font-weight:500;">Extracting Node Data...</div>`;
            try {
                const res = await fetch(`${TMDB_BASE}/tv/${tmdbId}/season/${seasonNum}?api_key=${TMDB_KEY}`);
                const data = await res.json();
                if (data.episodes) {
                    container.innerHTML = data.episodes.map(ep =>
                        `<button class="ep-btn" onclick="initPlayer('tv', '${imdbId}', '${tmdbId}', ${seasonNum}, ${ep.episode_number}); highlightEp(this);">
              <span class="ep-num">E${ep.episode_number}</span>
              <span style="font-size:0.75rem; color:var(--clr-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;">${escHtml(ep.name)}</span>
            </button>`
                    ).join('');
                }
            } catch (err) { container.innerHTML = `<div style="color:var(--clr-tertiary); font-weight:600;">Data extraction failed.</div>`; }
        }

        window.highlightEp = function (btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            setTimeout(() => document.body.style.overflow = '', 400);
        }

        /* ── SPATIAL THEATER PLAYER (Multi-Server) ── */
        let PLAYER_STATE = { type: 'movie', imdb: null, tmdb: null, season: 1, ep: 1, currentServer: 0 };

        // Robust embed fallback architecture
        const SERVERS = [
            {
                name: "Alpha (AE)",
                movie: (id, tmdb) => id ? `https://autoembed.co/movie/imdb/${id}` : `https://autoembed.co/movie/tmdb/${tmdb}`,
                tv: (id, s, e, tmdb) => id ? `https://autoembed.co/tv/imdb/${id}-${s}-${e}` : `https://autoembed.co/tv/tmdb/${tmdb}-${s}-${e}`
            },
            {
                name: "Beta (VL)",
                movie: (id, tmdb) => `https://vidlink.pro/movie/${tmdb}`,
                tv: (id, s, e, tmdb) => `https://vidlink.pro/tv/${tmdb}/${s}/${e}`
            },
            {
                name: "Gamma (VS)",
                movie: (id, tmdb) => `https://vidsrc.net/embed/movie?tmdb=${tmdb}`,
                tv: (id, s, e, tmdb) => `https://vidsrc.net/embed/tv?tmdb=${tmdb}&season=${s}&episode=${e}`
            },
            {
                name: "Delta (ME)",
                movie: (id, tmdb) => `https://multiembed.mov/directstream.php?video_id=${tmdb}&tmdb=1`,
                tv: (id, s, e, tmdb) => `https://multiembed.mov/directstream.php?video_id=${tmdb}&tmdb=1&s=${s}&e=${e}`
            }
        ];

        function renderServerPills() {
            const container = document.getElementById('server-list-container');
            container.innerHTML = SERVERS.map((srv, idx) => `
        <button class="mcb-server-btn ${idx === PLAYER_STATE.currentServer ? 'active' : ''}" 
                onclick="setServer(${idx})">${srv.name}</button>
      `).join('');
        }

        window.initPlayer = function (type, imdbId, tmdbId, season = 1, episode = 1) {
            PLAYER_STATE = { type, imdb: imdbId, tmdb: tmdbId, season, ep: episode, currentServer: 0 };

            const titleEl = document.querySelector('.modal-title');
            let displayTitle = titleEl ? titleEl.textContent : "Signal Stream";
            if (type === 'tv') displayTitle += ` - S${season}E${episode}`;

            document.getElementById('video-modal-title').textContent = displayTitle;
            renderServerPills();
            loadIframe();
            document.getElementById('video-modal-overlay').classList.add('active');
        }

        window.setServer = function (idx) {
            if (PLAYER_STATE.currentServer === idx) return;
            PLAYER_STATE.currentServer = idx;
            renderServerPills();
            const iframe = document.getElementById('video-iframe-player');
            iframe.src = ''; setTimeout(loadIframe, 100);
        }

        function loadIframe() {
            const srv = SERVERS[PLAYER_STATE.currentServer];
            const iframe = document.getElementById('video-iframe-player');
            if (PLAYER_STATE.type === 'movie') {
                iframe.src = srv.movie(PLAYER_STATE.imdb, PLAYER_STATE.tmdb);
            } else {
                iframe.src = srv.tv(PLAYER_STATE.imdb, PLAYER_STATE.season, PLAYER_STATE.ep, PLAYER_STATE.tmdb);
            }
        }

        window.refreshCurrentServer = function () {
            const iframe = document.getElementById('video-iframe-player');
            const tempSrc = iframe.src; iframe.src = ''; setTimeout(() => iframe.src = tempSrc, 200);
        }

        window.toggleAppFullscreen = function () {
            const container = document.getElementById('video-modal-container');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
                else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        window.closeVideoPlayer = function () {
            document.getElementById('video-modal-overlay').classList.remove('active');
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            setTimeout(() => {
                const iframe = document.getElementById('video-iframe-player');
                if (iframe) iframe.src = '';
            }, 500);
        }

        /* ── BOOTSTRAP ── */
        loadMedia(true);

    </script>
</body>

</html>
